<style>

const today=()=>ad(0),dt=d=>new Date(d+'T00:00'),loc=(d,o)=>dt(d).toLocaleDateString('en-IN',o);
const fmt=d=>loc(d,{weekday:'short',day:'numeric',month:'short'}),sh=d=>loc(d,{day:'numeric',month:'short'}),sy=d=>loc(d,{day:'numeric',month:'short',year:'2-digit'});
const money=n=>'₹'+(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const kf=n=>n>=1e5?+(n/1e5).toFixed(1)+'L':n>=1e3?+(n/1e3).toFixed(1)+'k':Math.round(n);
const sum=l=>l.reduce((s,x)=>s+(+x.a||0),0);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],CATS=['Instagram','Personal','Work','Learning','Exam','Errands','Life plan'];
const key=r=>(r||'').trim().toLowerCase()||'no reason';
const hue=s=>[...(s||'')].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const blank=()=>({id:uid(),d:'',a:'',r:''}),filled=x=>x.a!==''||x.r!==''||x.d!=='';
const pad=d=>{while(d.sp.length<25||filled(d.sp[d.sp.length-1]))d.sp.push(blank())};
const norm=d=>{d.cats=d.cats||CATS.slice();d.cur=d.cur||'';d.fl=d.fl||{y:[],m:[],r:[]};d.th=d.th||'auto';d.bud=+d.bud||0;if(!d.v){d.sp=d.sp.filter(filled).reverse();d.v=3}pad(d);return d};
const fresh=()=>({v:3,td:[['Plan this week’s Instagram posts',1,'Instagram'],['Log this month’s payments',1,'Personal'],['Finish the next course module',2,'Learning'],['Excel add-in: write the MVP feature list',3,'Work'],['Book the MS exam date',5,'Exam'],['Compare term insurance, LIC, Post Office',7,'Life plan'],['Clean mobile',null,'Errands'],['Buy new things',null,'Errands'],['Join TT: find a club or coach',null,'Life plan'],['Car driving class: shortlist 2 schools',null,'Life plan'],['Choose a car model',null,'Life plan']].map(([t,n,c])=>({id:uid(),t,d:n==null?'':ad(n),c})),sp:[],tab:'home'});
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.td)||!Array.isArray(S.sp))S=fresh();
norm(S);
const save=()=>{if(ok)try{localStorage.setItem(K,JSON.stringify(S))}catch(e){ok=false}};
const toast=m=>{const n=$('#note');n.textContent=m;n.hidden=false;navigator.vibrate&&navigator.vibrate(8);clearTimeout(toast.t);toast.t=setTimeout(()=>n.hidden=true,4500)};
const tot=()=>{const m=today().slice(0,7);$('#tm').textContent=money(sum(S.sp.filter(x=>(x.d||'').startsWith(m))));$('#ta').textContent=money(sum(S.sp))};
const mq=matchMedia('(prefers-color-scheme:dark)'),theme=()=>document.documentElement.classList.toggle('dk',S.th=='dark'||(S.th!='light'&&mq.matches));
if(mq.addEventListener)mq.addEventListener('change',theme);

const crow=()=>S.cats.map(c=>`<button type="button" class="chip${S.cur==c?' on':''}" data-act="cat" data-v="${esc(c)}">${esc(c)}${ce?' ×':''}</button>`).join('')+`<button type="button" class="chip" data-act="cnew">＋ New</button><button type="button" class="chip" data-act="cedit" aria-label="Edit categories">${ce?'Done':'✎'}</button>`;
const bar=(b,mx)=>`<div class="bc" title="${esc(b.l)} ${money(b.v)}"><small>${kf(b.v)}</small><i class="bb" style="--p:${b.v/mx}"></i><span>${esc(b.l)}</span><em>${esc(b.s)}</em></div>`;

function vHome(){
 const tz=today(),m=tz.slice(0,7),h=new Date().getHours(),od=S.td.filter(x=>x.d&&x.d<tz).length,dd=S.td.filter(x=>x.d==tz).length,
 sp=S.sp.filter(x=>x.d&&+x.a>0),mo=sp.filter(x=>x.d.startsWith(m)),ms=sum(mo),
 up=S.td.filter(x=>x.d).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).slice(0,5),
 dy=[...Array(7)].map((_,i)=>{const d=ad(i-6);return{l:loc(d,{weekday:'short'}),s:'',v:sum(sp.filter(x=>x.d==d))}}),
 mx=Math.max(1,...dy.map(b=>b.v)),nm={},g={};
 mo.forEach(x=>{const k=key(x.r);nm[k]=(x.r||'').trim()||'No reason';g[k]=(g[k]||0)+ +x.a});
 const tp=Object.entries(g).sort((a,b)=>b[1]-a[1])[0],pc=S.bud?Math.min(100,ms/S.bud*100):0,
 gr=h<5?'Still up':h<12?'Good morning':h<17?'Good afternoon':'Good evening',
 sub=od?`${od} overdue${dd?`, ${dd} due today`:''}`:dd?`${dd} due today`:'You are all clear today';
 return `<section class="hero"><h2>${gr}, ${NAME}</h2><p>${sub}</p></section>
 <div class="kpi"><div><small>Open to-dos</small><b>${S.td.length}</b></div><div class="${dd?'hl':''}"><small>Due today</small><b>${dd}</b></div><div class="${od?'bad':''}"><small>Overdue</small><b>${od}</b></div>
 <button data-act="bud"><small>This month</small><b>${money(ms)}</b>${S.bud?`<i class="pb"><u class="${ms>S.bud?'over':''}" style="width:${pc}%"></u></i><em>${Math.round(ms/S.bud*100)}% of ${money(S.bud)}</em>`:'<em>Tap to set a budget</em>'}</button></div>
 <h3 class="sec">Up next</h3><div class="grid">${up.map(x=>`<div class="up"><span class="${x.d<tz?'late':''}">${x.d==tz?'Today':sh(x.d)}</span><p>${esc(x.t)}</p>${x.c?`<em class="cat has" style="--k:${hue(x.c)}">${esc(x.c)}</em>`:''}</div>`).join('')||'<p class="empty">No dated to-dos yet. Add one with a date in the To-do tab.</p>'}</div>
 <h3 class="sec">Spend, last 7 days</h3><div class="plot sm">${dy.map(b=>bar(b,mx)).join('')}</div>
 <p class="note">${tp?`<b>${esc(nm[tp[0]])}</b> leads this month at ${Math.round(tp[1]/ms*100)}% of your spend.`:'Add spends to see insights here.'}</p>`
}

function vTodo(){
 const tz=today();
 return `<form id="addf" class="addf"><input class="box" name="t" placeholder="Write a to-do, press Enter" autocomplete="off" enterkeyhint="done"><div class="cr" id="cr">${crow()}</div><input class="box" type="date" name="d" aria-label="Date"><button class="pri">Add</button></form>
 <div class="pad">${S.td.map(x=>`<div class="ln" data-l="td" data-id="${x.id}"><input data-k="t" value="${esc(x.t)}" aria-label="To-do"><label class="cat${x.c?' has':''}" style="--k:${hue(x.c)}"><span>${esc(x.c||'Tag')}</span><select data-k="c" aria-label="Category"><option value="">No tag</option>${S.cats.map(c=>`<option${c==x.c?' selected':''}>${esc(c)}</option>`).join('')}</select></label><label class="dtw${x.d?(x.d<tz?' has late':' has'):''}"><span>${x.d?sh(x.d):'📅'}</span><input type="date" data-k="d" value="${x.d}" aria-label="Date"></label><button data-act="tdel" data-id="${x.id}" aria-label="Remove">×</button></div>`).join('')||'<p class="none">Your page is empty. Write the first line above.</p>'}</div>`
}

function vDates(){
  const tz=today(),cats=[...S.cats];
  const extras=[...new Set(S.td.map(x=>(x.c||'').trim()).filter(c=>c&&!cats.includes(c)))];
  cats.push(...extras);
  if(S.td.some(x=>!x.c))cats.push('Uncategorized');
  const dates=[...new Set(S.td.map(x=>x.d||''))].sort((a,b)=>{
    if(!a)return 1;if(!b)return -1;return a.localeCompare(b);
  });
  const widths=`grid-template-columns:130px repeat(${Math.max(1,cats.length)},minmax(145px,1fr))`;
  const head=`<div class="date-cell date-stamp">Date</div>`+cats.map(c=>`<div class="date-cell">${esc(c)}</div>`).join('');
  const rows=dates.map(d=>{
    const label=d?`${p2(+d.slice(5,7))}/${p2(+d.slice(8,10))}/${d.slice(0,4)}`:'No date';
    const cls=d?(d===tz?'today':d<tz?'overdue':''):'';
    const dateCell=`<div class="date-cell date-stamp ${cls}">${esc(label)}</div>`;
    const cells=cats.map(c=>{
      const items=S.td.filter(x=>(x.d||'')===d&&((x.c||'').trim()===(c==='Uncategorized'?'':c)));
      return `<div class="date-cell">${items.map(x=>`<div class="date-task">${esc(x.t)||'Untitled'}</div>`).join('')||'<span class="date-empty">—</span>'}</div>`;
    }).join('');
    return `<div class="date-row" style="${widths}">${dateCell}${cells}</div>`;
  }).join('');
  return `<p class="brandline">Tasks grouped by date · each date appears once</p><div class="dateboard"><div class="dateboard-inner"><div class="date-row date-head" style="${widths}">${head}</div>${rows||`<p class="empty">Add a to-do to see your date-wise plan.</p>`}</div></div>`;
}

const srow=(x,n)=>`<div class="sr${filled(x)?' f':''}" data-l="sp" data-id="${x.id}"><i class="rn">${n}</i><label class="dc"><span>${x.d?sy(x.d):''}</span><input type="date" data-k="d" value="${x.d}" aria-label="Date, row ${n}"></label><input type="number" inputmode="decimal" data-k="a" value="${x.a}" aria-label="Amount, row ${n}"><input data-k="r" value="${esc(x.r)}" aria-label="Reason, row ${n}" autocomplete="off"><button data-act="sdel" data-id="${x.id}" aria-label="Remove row ${n}">×</button></div>`;

function vSpend(){
 pad(S);const m=today().slice(0,7);
 return `<div class="sum"><div><small>This month</small><b id="tm">${money(sum(S.sp.filter(x=>(x.d||'').startsWith(m))))}</b></div><div><small>Total</small><b id="ta">${money(sum(S.sp))}</b></div></div>
 <div class="sheet" id="sheet"><div class="sh"><span></span><span><b>A</b>Date</span><span><b>B</b>Amount</span><span><b>C</b>Reason</span><span></span></div>${S.sp.map((x,i)=>srow(x,i+1)).join('')}</div>`
}

function vChart(){
 const f=S.fl,all=S.sp.filter(x=>x.d&&+x.a>0),
 L=all.filter(x=>(!f.y.length||f.y.includes(x.d.slice(0,4)))&&(!f.m.length||f.m.includes(x.d.slice(5,7)))&&(!f.r.length||f.r.includes(key(x.r)))).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0),
 ys=[...new Set(all.map(x=>x.d.slice(0,4)))].sort().reverse(),rs={};
 all.forEach(x=>{rs[key(x.r)]=rs[key(x.r)]||(x.r||'').trim()||'No reason'});
 const sl=(g,t,o)=>`<div class="slr"><button class="sl${f[g].length?' on':''}" data-act="sc" data-g="${g}">${t}${f[g].length?' ✕ clear':''}</button><div class="sch">${o.map(([v,n])=>`<button class="chip${f[g].includes(v)?' on':''}" data-act="sl" data-g="${g}" data-v="${esc(v)}">${esc(n)}</button>`).join('')||'<span class="sm">No data yet</span>'}</div></div>`;
 let B,note;
 if(L.length>10){const g={};L.forEach(x=>{const k=x.d.slice(0,7);g[k]=(g[k]||0)+ +x.a});const ks=Object.keys(g).sort(),multi=new Set(ks.map(k=>k.slice(0,4))).size>1;B=ks.map(k=>({l:MN[+k.slice(5)-1],s:multi?k.slice(0,4):'',v:g[k]}));note='More than 10 entries, so each bar is a month total.'}
 else{B=L.map(x=>({l:(x.r||'').trim()||'—',s:sh(x.d),v:+x.a}));note='Each bar is one entry.'}
 const mx=Math.max(1,...B.map(b=>b.v));
 return `<p class="note"><b>${money(sum(L))}</b> in ${L.length} ${L.length==1?'entry':'entries'}. ${note}</p>`+(B.length?`<div class="plot">${B.map(b=>bar(b,mx)).join('')}</div>`:'<p class="empty">No spends match these slicers.</p>')+sl('m','Month',MN.map((n,i)=>[p2(i+1),n]))+sl('y','Year',ys.map(y=>[y,y]))+sl('r','Reason',Object.entries(rs))
}

function menu(){
 dlg.innerHTML=`<div class="menu"><h2>${NAME}</h2><p class="sm">Signed in on this device</p><p class="sm" style="margin-top:14px">Theme</p>
 <div class="chips">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([k,n])=>`<button class="chip${S.th==k?' on':''}" data-act="th" data-v="${k}">${n}</button>`).join('')}</div>
 <button data-act="bud">Monthly budget${S.bud?': '+money(S.bud):''}</button><button data-act="csv">Download CSV</button><button data-act="exp">Export backup (JSON)</button>
 <label class="chip" style="display:block;text-align:center;margin-top:10px;border-radius:12px;padding:9px 12px;font-size:15px">Import backup<input type="file" accept=".json" id="imp"></label>
 <button data-act="out">Sign out</button><button data-act="close">Close</button></div>`;
 if(!dlg.open)dlg.showModal();
}

function render(j){
 const a=$('#addf'),keep=a&&[a.elements.t.value,a.elements.d.value];
 $('#sub').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+(ok?'':'. Preview only, changes are not saved here');
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==S.tab));
 const A=$('#app');A.innerHTML=({home:vHome,todo:vTodo,dates:vDates,spend:vSpend,chart:vChart}[S.tab]||vHome)();
 if(j){A.classList.remove('in');void A.offsetWidth;A.classList.add('in')}
 const b=$('#addf');if(b&&keep){b.elements.t.value=keep[0];b.elements.d.value=keep[1]}
 if(j&&S.tab=='spend'){const r=$('#sheet').children[S.sp.findIndex(x=>!filled(x))+1];r&&r.scrollIntoView({block:'center'})}
 save();
}

const unlock=(fast,home)=>{
 if(home)S.tab='home';theme();render(1);
 const g=$('#lg');
 if(fast){document.body.classList.remove('lk');return}
 g.classList.add('out');setTimeout(()=>{document.body.classList.remove('lk');g.classList.remove('out')},350);
};
const lock=()=>{document.body.classList.add('lk');$('#lp').value='';$('#le').textContent='';setTimeout(()=>$('#lu').focus(),60)};

document.addEventListener('click',e=>{
 const t=e.target;
 if(t.type=='date')try{t.showPicker()}catch(x){}
 const b=t.closest('[data-act],[data-tab]');if(!b)return;
 const d=b.dataset;
 if(d.tab){S.tab=d.tab;scrollTo(0,0);render(1);return}
 switch(d.act){
  case'eye':{const p=$('#lp'),show=p.type==='password';p.type=show?'text':'password';b.setAttribute('aria-label',show?'Hide password':'Show password');b.title=show?'Hide password':'Show password';b.innerHTML=show?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0112 5c6.5 0 10 7 10 7a15.7 15.7 0 01-4 4.7"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.3 3.5-.8"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';return}
  case'tdel':case'sdel':{const l=d.act=='tdel'?'td':'sp',i=S[l].findIndex(x=>x.id==d.id);last={l,i,x:S[l].splice(i,1)[0]};toast('Removed. Tap to undo');break}
  case'undo':if(last){S[last.l].splice(last.i,0,last.x);last=null;$('#note').hidden=true}break;
  case'sl':{const a=S.fl[d.g],i=a.indexOf(d.v);i<0?a.push(d.v):a.splice(i,1);break}
  case'sc':S.fl[d.g]=[];break;
  case'cat':if(ce){S.cats=S.cats.filter(c=>c!=d.v);S.td.forEach(x=>{if(x.c==d.v)x.c=''});if(S.cur==d.v)S.cur='';break}S.cur=S.cur==d.v?'':d.v;document.querySelectorAll('#cr [data-act=cat]').forEach(x=>x.classList.toggle('on',x.dataset.v==S.cur));save();return;
  case'cnew':{const n=(prompt('New category name')||'').trim();if(n&&!S.cats.includes(n)){S.cats.push(n);S.cur=n}break}
  case'cedit':ce=!ce;$('#cr').innerHTML=crow();return;
  case'bud':{const v=prompt('Monthly budget in ₹ (0 clears it)',S.bud||'');if(v===null)return;S.bud=Math.max(0,+v||0);if(dlg.open)dlg.close();break}
  case'th':S.th=d.v;theme();save();menu();return;
  case'menu':menu();return;
  case'csv':{
   const q=v=>{const s=String(v==null?'':v);return '"'+s.replace(/"/g,'""')+'"'};
   const rows=[['Record Type','Date','Category','To-do','Amount (INR)','Reason']];
   S.td.forEach(x=>rows.push(['To-do',x.d||'',x.c||'',x.t||'','','']));
   S.sp.filter(filled).forEach(x=>rows.push(['Spend',x.d||'','','',x.a||'',x.r||'']));
   const csv='\\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\\r\\n');
   const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
   const a=document.createElement('a');a.href=url;a.download='focus-data-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
   toast('CSV downloaded');return
  }
  case'exp':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='focus-backup.json';a.click();return}
  case'out':try{localStorage.removeItem(AK)}catch(x){}sess=false;dlg.close();lock();return;
  case'close':dlg.close();return;
 }
 render();
});

document.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id=='lf'){
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;
  if(cy('focus|'+u+'|'+p)==H){sess=true;if($('#lkeep').checked)try{localStorage.setItem(AK,H)}catch(x){}unlock(0,1)}
  else{const c=$('#lf');c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');$('#le').textContent='That username or password is not right. Check both and try again.';$('#lp').select()}
  return;
 }
 if(e.target.id!='addf')return;
 const f=new FormData(e.target),t=(f.get('t')||'').trim();
 if(!t)return;
 S.td.unshift({id:uid(),t,d:f.get('d')||'',c:S.cur});
 e.target.reset();render();$('#addf [name=t]').focus();
});

document.addEventListener('input',e=>{
 const t=e.target,r=t.closest('[data-l]');
 if(!r||!t.dataset.k)return;
 const l=r.dataset.l,it=S[l].find(x=>x.id==r.dataset.id);
 if(!it)return;
 it[t.dataset.k]=t.value;
 if(l=='sp'){
  if(t.dataset.k!='d'&&!it.d){it.d=today();r.querySelector('[data-k=d]').value=it.d}
  r.querySelector('.dc span').textContent=it.d?sy(it.d):'';
  r.classList.toggle('f',filled(it));
  if(filled(S.sp[S.sp.length-1])){const n=blank();S.sp.push(n);$('#sheet').insertAdjacentHTML('beforeend',srow(n,S.sp.length))}
  tot();
 }
 save();
});

document.addEventListener('keydown',e=>{
 const t=e.target,r=t.closest&&t.closest('.sr');
 if(e.key!='Enter'||!r||!t.dataset.k||t.type=='date')return;
 e.preventDefault();
 const n=r.nextElementSibling,c=n&&n.querySelector('[data-k='+t.dataset.k+']');
 if(c)c.focus();
});

document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id=='imp'){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.td)||!Array.isArray(d.sp))throw 0;S=norm(d);dlg.close();theme();render();toast('Backup imported')}catch(x){toast('That file is not a Focus backup')}};
  r.readAsText(t.files[0]);return;
 }
 const r=t.closest('[data-l]');
 if(r&&r.dataset.l=='td'&&(t.dataset.k=='d'||t.dataset.k=='c'))render();
});

theme();
if(sess)unlock(1);else lock();
</script>
</body>
</html>
