<style>
:root{color-scheme:light;--bg:#eceef6;--card:#fff;--ink:#1d2140;--mute:#626888;--line:#d8dbed;--acc:#f2a900;--on:#1d1500;--paper:#fffbe9;--rule:#cfd8f3;--mar:#f0a3a3;--sh:0 1px 2px #14183c0f,0 10px 26px #14183c12}

*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 420px at 8% -8%,color-mix(in srgb,var(--acc) 16%,transparent),transparent) fixed,radial-gradient(700px 400px at 100% 0,#7c46b91f,transparent) fixed,var(--bg);color:var(--ink);font:15px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
h1,h2,.sec,.ln input[data-k=t],.sum b,.kpi b,.av{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
header{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 6px}
.brandlock{display:flex;align-items:center;gap:10px;min-width:0}

.brandtag{font-size:10px!important;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:3px}

main{max-width:760px;margin:auto;padding:6px 12px}
.in{animation:up .3s ease}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,.dc:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.pri{background:linear-gradient(180deg,#ffd36b,var(--acc));color:var(--on);border-color:transparent;font-weight:700}
.av{width:42px;height:42px;border-radius:50%;border:0;font-size:18px;font-weight:700;color:#1d1500;background:linear-gradient(135deg,#ffd36b,#f2a900);padding:0;box-shadow:0 6px 16px #f2a90055}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2b2f6b,#4b3aa8 62%,#7c46b9);color:#f4f5ff;border-radius:26px;padding:24px 20px;margin-top:8px;box-shadow:0 14px 34px #2b2f6b59}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(#ffc24766,transparent 65%)}
.hero h2{font-size:30px;line-height:1.1}.hero p{opacity:.85;margin-top:6px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kpi>*{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);text-align:left}
.kpi small{display:block;color:var(--mute);font-size:12.5px}.kpi b{display:block;font-size:26px}
.kpi .hl{outline:2px solid var(--acc)}.kpi .bad b{color:#ef5b5b}

.pb{display:block;height:5px;background:var(--line);border-radius:9px;margin:8px 0 4px;overflow:hidden}
.pb u{display:block;height:100%;background:var(--acc);border-radius:9px}.pb u.over{background:#ef5b5b}
.sec{font-size:18px;margin:18px 4px 8px}
.up{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.up:first-child{border-top:0}
.up span{width:56px;font-weight:700;font-size:13px}.up .late{color:#ef5b5b}
.up p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.addf{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.addf .box:first-child{flex:1 1 100%}
.addf input[type=date]{flex:1;width:auto}
.cr{display:flex;gap:6px;flex:1 1 100%;overflow-x:auto;scrollbar-width:none}
.cr .chip{flex:none;padding:4px 11px;font-size:13px}
.pad{position:relative;min-height:352px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);background:var(--paper) repeating-linear-gradient(transparent 0 43px,var(--rule) 43px 44px);overflow:hidden}
.pad::before{content:"";position:absolute;left:36px;top:0;bottom:0;border-left:2px solid var(--mar)}
.ln{position:relative;display:flex;align-items:center;gap:4px;height:44px;padding:0 6px 0 46px}
.ln input[data-k=t]{flex:1;min-width:0;height:44px;border:0;background:none;font-size:17px;padding:0}
.ln>button{border:0;background:none;color:var(--mute);font-size:22px;padding:0 8px;height:44px;border-radius:0}
.dtw,.cat{position:relative;font-size:12.5px;color:var(--mute);padding:3px 9px;border-radius:99px;white-space:nowrap;cursor:pointer}
.cat span{display:block;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.cat.has{background:hsl(var(--k) 65% 50%/.18);color:hsl(var(--k) 70% 36%);font-weight:700;font-style:normal}
.dk .cat.has{color:hsl(var(--k) 80% 74%)}
.cat select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dtw.has{background:var(--acc);color:var(--on);font-weight:700}.dtw.late{background:#ef5b5b;color:#fff}
.dtw input,.dc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}

.none{padding:0 14px 0 46px;line-height:44px;color:var(--mute)}
.grid{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden;margin-top:8px}

.gr>div{padding:11px 12px}

.gd.late{color:#ef5b5b}.gd.now{background:var(--acc);color:var(--on)}
.gt p+p,.gc p+p{margin-top:6px}.gc{min-width:0}.gc .cat{display:inline-flex;max-width:100%;padding:3px 7px}.gc .cat span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catboard{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--sh);margin-top:8px}
.catcol{flex:1 0 150px;min-width:150px;border-right:1px solid var(--line)}.catcol:last-child{border-right:0}
.cathead{background:#70ad47;color:#101b0a;font-weight:700;padding:9px 10px;border-bottom:1px solid #5c9638;white-space:nowrap}
.catitems{padding:0 8px}

.catitem .taskdate.overdue{background:#ef5b5b;color:#fff}

.brandline{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.pw button{width:38px;height:38px;display:grid;place-items:center;padding:0;border:0;background:transparent;color:#d9dcff;border-radius:10px}
.pw button svg{width:20px;height:20px;display:block}
.dateboard{margin-top:8px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--sh)}

.date-row{display:grid;border-top:1px solid var(--line)}

.date-stamp.today{background:var(--acc);color:var(--on)}

@media(max-width:480px){.catcol{flex-basis:145px;min-width:145px}}

.sheet{border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow-x:auto;background:var(--card);outline:0;-webkit-user-select:none;user-select:none;position:relative}
.sheet.rm{touch-action:none}

.c.et{--t:2px}.c.eb{--b:2px}.c.el{--l:2px}.c.er{--r:2px}
.c.act{background:var(--card);outline:2px solid var(--acc);outline-offset:-2px}
#ed{position:absolute;inset:0;width:100%;height:100%;border:0;outline:2px solid var(--acc);outline-offset:-2px;background:var(--card);padding:0 10px;font:inherit;z-index:3;border-radius:0}
.c.a #ed{text-align:right}

.tools{position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:4;margin:10px 0;padding:8px;border-radius:18px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--sh)}
.tb{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}

.st{font-size:12px;color:var(--mute);margin:7px 4px 0;min-height:16px}.st b{color:var(--ink)}
input[type=number]{-moz-appearance:textfield}input::-webkit-inner-spin-button{display:none}
.chips{display:flex;gap:8px;margin:8px 0}

.chip.on{background:linear-gradient(180deg,#ffd36b,var(--acc));color:var(--on);border-color:transparent;font-weight:700}
.note{color:var(--mute);font-size:13px;margin:8px 2px}.note b{color:var(--ink);font-size:17px}
.plot{display:flex;gap:6px;height:210px;padding:4px 6px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.plot.sm{height:160px}

.paste-panel{display:grid;gap:10px;padding:4px}

.reason-bar-wrap{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.reason-bar{height:100%;width:var(--w);background:linear-gradient(90deg,var(--acc),#c58bff);border-radius:99px}

.bc{flex:1 0 30px;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;text-align:center}

dialog{border:0;border-radius:24px 24px 0 0;width:min(520px,100%);margin:auto auto 0;padding:18px;background:var(--bg);color:var(--ink)}
@media(min-width:700px){dialog{margin:auto;border-radius:24px}}
dialog::backdrop{background:#0008;backdrop-filter:blur(3px)}
dialog h2{font-size:24px}
.menu button{display:block;width:100%;margin-top:10px}
.menu .chips button{margin:0;width:auto}
.sm{color:var(--mute);font-size:13.5px}

.lk header,.lk main,.lk nav{display:none}

.lc h2{font-size:30px}.ls{opacity:.75;margin:4px 0 18px}

.lc input:not([type=checkbox]){width:100%;margin-top:5px;padding:13px 14px;border-radius:14px;border:1px solid #ffffff30;background:#0b0c2066;color:#fff;font-size:16px}
.pw{position:relative;display:block}.pw button{position:absolute;right:4px;bottom:8px;border:0;background:none;color:#ffd36b;padding:6px 10px;font-size:13px}
.kl{display:flex;gap:8px;align-items:center}
.le{color:#ffa3a3;min-height:20px;margin:10px 0 4px;font-size:13px}.capswarn{display:none;color:#ffd36b;font-size:12.5px;margin:7px 2px 0}.capswarn.show{display:block}.clipbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.clipbar button{font-size:13px;padding:7px 12px}

header,main,.appcredit{max-width:880px}
.hero{background:radial-gradient(520px 240px at 92% 0,#ffc2474d,transparent 60%),linear-gradient(135deg,#1f2358,#4b3aa8 60%,#8a4fc7)}
.kpi>*,.sum div{transition:transform .2s,box-shadow .2s}.kpi>*:hover,.sum div:hover{transform:translateY(-2px);box-shadow:0 14px 30px #14183c1f}
.pri{box-shadow:0 6px 16px #f2a9004d}nav .on{box-shadow:0 6px 16px #f2a90050}
button:hover:not(:disabled){border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.sum b{font-size:26px}.pad,.grid,.dateboard,.catboard{border-radius:18px}

/* ===== AURORA redesign ===== */
:root{--bg:#f4f0ff;--card:#fff;--ink:#1a1240;--mute:#6f68a3;--line:#e6e0ff;--acc:#ff4f8b;--on:#fff;--paper:#fff7fb;--rule:#ffdcec;--mar:#ff9ec3;--sel:#10c4b0;--sh:0 14px 36px #7c5cff22,0 2px 6px #7c5cff12}
.dk{--bg:#0a0620;--card:#171040;--ink:#f6f2ff;--mute:#aaa0e6;--line:#30286a;--acc:#ff6fa5;--paper:#150f38;--rule:#2b2163;--mar:#a43a7a;--sel:#2ee6cf;--sh:0 14px 36px #0007}
body{background:radial-gradient(700px 480px at 0 -5%,#ff4f8b33,transparent 60%) fixed,radial-gradient(640px 460px at 100% 8%,#7c5cff38,transparent 60%) fixed,radial-gradient(700px 500px at 60% 105%,#10c4b030,transparent 60%) fixed,var(--bg)}
h1,h2,.sec,.ln input[data-k=t],.sum b,.kpi b,.av,.brandname{font-family:"Avenir Next","Segoe UI Variable Display","Trebuchet MS",system-ui,sans-serif;letter-spacing:-.025em}
.brandname{font-weight:900;font-size:28px;background:linear-gradient(90deg,#7c5cff,#ff4f8b 55%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.brandmark{background:linear-gradient(135deg,#7c5cff,#ff4f8b);box-shadow:0 8px 22px #ff4f8b55;transform:rotate(-6deg)}
.av{background:linear-gradient(135deg,#ff8a3d,#ff4f8b);color:#fff;box-shadow:0 8px 20px #ff4f8b66}
.pri,.chip.on{background:linear-gradient(135deg,#ff4f8b,#ff8a3d);color:#fff;border-color:transparent;box-shadow:0 8px 20px #ff4f8b4d}
.hero{padding:30px 24px;border-radius:30px;background:linear-gradient(120deg,#5b2be0,#c43cf0 48%,#ff4f8b 78%,#ffa02e);box-shadow:0 22px 50px #8a3cf055}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(#10c4b077,transparent 65%)}
.hero::after{background:radial-gradient(#ffffff55,transparent 65%)}
.hero h2{font-size:34px;font-weight:900;position:relative}.hero p{position:relative;font-size:16px}
.kpi>*{border:0;color:#fff;border-radius:22px;box-shadow:0 14px 28px #0002}
.kpi>*:nth-child(1){background:linear-gradient(135deg,#6a4cff,#9a7bff)}
.kpi>*:nth-child(2){background:linear-gradient(135deg,#0ab3a1,#43e0b5)}
.kpi>*:nth-child(3){background:linear-gradient(135deg,#ff4f6d,#ff8a5c)}
.kpi>*:nth-child(4){background:linear-gradient(135deg,#ff9d1c,#ffd03a);color:#3a2300}
.kpi small,.kpi em{color:inherit;opacity:.88}.kpi .bad b{color:#fff}.kpi .hl{outline:3px solid #fff9;outline-offset:-3px}
.pb{background:#fff4}.pb u{background:#fff}.pb u.over{background:#7a0020}
.sec{font-size:20px;font-weight:850}
.sec::before{content:"";display:inline-block;width:6px;height:20px;border-radius:9px;background:linear-gradient(#ff4f8b,#7c5cff);margin-right:9px;vertical-align:-4px}
.grid,.plot,.reason-breakdown,.slr,.sheet,.dateboard,.catboard,.pad,.sum div{border:1px solid color-mix(in srgb,var(--acc) 16%,var(--line));border-radius:24px}
.sum>div:nth-child(1){background:linear-gradient(135deg,#7c5cff,#b58cff);color:#fff;border:0}
.sum>div:nth-child(2){background:linear-gradient(135deg,#0ab3a1,#43e0b5);color:#fff;border:0}
.sum small{color:inherit;opacity:.9}.sum b{font-size:28px;font-weight:900}
.bc:nth-child(5n+1) .bb{background:linear-gradient(#ff8fbd,#ff4f8b)}.bc:nth-child(5n+2) .bb{background:linear-gradient(#b9a2ff,#7c5cff)}.bc:nth-child(5n+3) .bb{background:linear-gradient(#6df0d8,#0ab3a1)}.bc:nth-child(5n+4) .bb{background:linear-gradient(#ffd36b,#ff9d1c)}.bc:nth-child(5n) .bb{background:linear-gradient(#8fd0ff,#2f8cff)}
.bb{border-radius:10px 10px 3px 3px}
.reason-bar{background:linear-gradient(90deg,#7c5cff,#ff4f8b,#ffb020)}
.reason-head,.gr.h{background:linear-gradient(90deg,#7c5cff1f,#ff4f8b1f)}
.chip{border-radius:99px}.chip:hover{border-color:var(--acc)}
.dtw.has{background:linear-gradient(135deg,#0ab3a1,#43e0b5);color:#032b25}.dtw.late{background:linear-gradient(135deg,#ff4f6d,#ff8a5c);color:#fff}
.date-head .date-cell{background:linear-gradient(135deg,#7c5cff,#c04cfd);color:#fff}
.date-stamp.today,.gd.now{background:linear-gradient(135deg,#ff9d1c,#ffd03a);color:#3a2300}
.catcol:nth-child(6n+1) .cathead{background:linear-gradient(135deg,#7c5cff,#a78bfa)}.catcol:nth-child(6n+2) .cathead{background:linear-gradient(135deg,#ff4f8b,#ff8fbd)}.catcol:nth-child(6n+3) .cathead{background:linear-gradient(135deg,#0ab3a1,#43e0b5)}.catcol:nth-child(6n+4) .cathead{background:linear-gradient(135deg,#ff9d1c,#ffd03a)}.catcol:nth-child(6n+5) .cathead{background:linear-gradient(135deg,#2f8cff,#7cc4ff)}.catcol:nth-child(6n) .cathead{background:linear-gradient(135deg,#ff4f6d,#ff8a5c)}
.cathead{color:#fff;border:0;text-shadow:0 1px 2px #0003}.catcol:nth-child(6n+4) .cathead{color:#3a2300;text-shadow:none}
nav{border-radius:30px;padding:7px;background:color-mix(in srgb,var(--card) 74%,transparent);border:1px solid #fff5;box-shadow:0 20px 44px #7c5cff44}
nav button{border-radius:22px;font-weight:650}nav button span{font-size:20px}
nav .on{color:#fff;box-shadow:0 8px 18px #0003;background:linear-gradient(135deg,#7c5cff,#a78bfa)}
nav button:nth-child(2).on{background:linear-gradient(135deg,#ff4f8b,#ff8fbd)}nav button:nth-child(3).on{background:linear-gradient(135deg,#0ab3a1,#43e0b5)}nav button:nth-child(4).on{background:linear-gradient(135deg,#ff9d1c,#ffc43a);color:#3a2300}nav button:nth-child(5).on{background:linear-gradient(135deg,#2f8cff,#7cc4ff)}
.sh span{background:linear-gradient(135deg,#7c5cff,#c04cfd);color:#ffffffd9;border-right-color:#ffffff30}.sh b{color:#ffd03a}
.sh span.hl,.rn.hl{background:linear-gradient(135deg,#ff4f8b,#ff8a3d);color:#fff}.sh span.hl b{color:#fff}
.rn{background:color-mix(in srgb,#7c5cff 10%,var(--card));color:var(--mute);font-weight:700}
.sr:nth-child(odd)>.c:not(.sel):not(.act){background:color-mix(in srgb,#7c5cff 4%,var(--card))}
.c.sel{background:color-mix(in srgb,var(--sel) 20%,var(--card));box-shadow:inset 0 var(--t,0px) 0 var(--sel),inset 0 calc(var(--b,0px)*-1) 0 var(--sel),inset var(--l,0px) 0 0 var(--sel),inset calc(var(--r,0px)*-1) 0 0 var(--sel)}
.c.act,#ed{outline-color:var(--sel)}.c.a{color:#e0356f;font-weight:750}.dk .c.a{color:#ff8fbd}
.tools{border-radius:22px;border:1px solid color-mix(in srgb,var(--acc) 22%,var(--line))}
.tb button{background:color-mix(in srgb,#7c5cff 9%,var(--card));border-radius:12px}.tb .on{background:linear-gradient(135deg,#10c4b0,#43e0b5);color:#032b25}
.st b{color:var(--acc)}
.pad{background:var(--paper) repeating-linear-gradient(transparent 0 43px,var(--rule) 43px 44px)}
#note{background:linear-gradient(135deg,#1a1240,#5b2be0);color:#fff;box-shadow:0 12px 30px #5b2be066}
.lg{background:linear-gradient(120deg,#2a0a6b,#7c2cff,#ff3d8b,#ff9a3d,#10c4b0);background-size:400% 400%}
.lm{background:linear-gradient(135deg,#ff4f8b,#ff9d1c);color:#fff}
dialog{background:var(--bg);border:1px solid var(--line)}

/* ===== Rainy forest login ===== */
.lg{background:linear-gradient(180deg,#0a1d19,#0f3a2d 52%,#06110e);animation:none;background-size:auto}
.lg::before{display:none}
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fx::before{content:"";position:absolute;inset:0;background:radial-gradient(540px 330px at 72% -4%,#9dffd84d,transparent 70%)}
.fx .tl{position:absolute;left:0;bottom:0;width:100%}
.fog{position:absolute;left:-50%;width:200%;height:26%;background:linear-gradient(90deg,transparent,#d6f5ea33 30%,#d6f5ea4d 55%,transparent);filter:blur(22px);animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(22%)}}
#rain{position:absolute;inset:0;width:100%;height:100%}
.flash{position:absolute;inset:0;background:#cfe9ff;opacity:0;animation:fl 13s infinite}
@keyframes fl{0%,90%,100%{opacity:0}91%{opacity:.16}93%{opacity:.02}95%{opacity:.1}97%{opacity:0}}
.ff{position:absolute;width:5px;height:5px;border-radius:50%;background:#d8ff9a;box-shadow:0 0 12px 4px #b6ff6a99;animation:fly 9s ease-in-out infinite alternate}
@keyframes fly{to{transform:translate(40px,-60px);opacity:.25}}
.lc{z-index:2;background:#05140fa6;border-color:#a8ffd433;backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);box-shadow:0 30px 80px #000a,inset 0 1px 0 #ffffff22}
.lc input:not([type=checkbox]){background:#02100b99;border-color:#a8ffd433}
.lc input:not([type=checkbox]):focus{outline:2px solid #34d399;border-color:transparent}
.lc .pri{background:linear-gradient(135deg,#34d399,#10b981);color:#03221a;box-shadow:0 10px 26px #10b98155}
.lm{background:linear-gradient(135deg,#6ee7b7,#10b981);color:#03221a}
.pw button{color:#6ee7b7}

 sh.querySelectorAll('.sel,.act,.hl').forEach(e=>e.classList.remove('sel','act','et','eb','el','er','hl'));
 const g=rng();if(!g){stat();return}
 for(let r=g.r0;r<=g.r1;r++){const row=sh.children[r+1];if(!row)continue;row.children[0].classList.add('hl');
  for(let c=g.c0;c<=g.c1;c++){const e=row.children[c+1];e.classList.add('sel');
   if(r===g.r0)e.classList.add('et');if(r===g.r1)e.classList.add('eb');if(c===g.c0)e.classList.add('el');if(c===g.c1)e.classList.add('er');
   if(r===SR.r1&&c===SR.c1)e.classList.add('act')}}
 for(let c=g.c0;c<=g.c1;c++)sh.children[0].children[c+1].classList.add('hl');
 stat()}

function move(dr,dc,ex){if(!SR)return;const R=S.sp.length-1;
 if(ex){SR.r2=Math.max(0,Math.min(R,SR.r2+dr));SR.c2=Math.max(0,Math.min(3,SR.c2+dc))}
 else{const r=Math.max(0,Math.min(R,SR.r1+dr)),c=Math.max(0,Math.min(3,SR.c1+dc));SR={r1:r,c1:c,r2:r,c2:c}}

function setVal(x,k,v){v=String(v==null?'':v).trim();
 if(k==='d'){if(v==='')x.d='';else{const i=spendDateISO(v);if(!i)return false;x.d=i}}
 else if(k==='a'){v=v.replace(/[₹,\s]/g,'').replace(/^\((.*)\)$/,'$1');if(v!==''&&!isFinite(+v))return false;x.a=v}
 else x[k]=v;return true}

function pasteGrid(raw){
 let g=tsv(raw);if(!g.length||!SR)return;const gr=rng();let c0=gr.c0,r0=gr.r0;
 const hm=g[0].map(h=>{h=h.toLowerCase();return /date/.test(h)?0:/spent|paid|person/.test(h)?3:/amount|withdraw|debit/.test(h)?1:/narrat|reason|descr|particular/.test(h)?2:-1});
 if(hm.filter(i=>i>=0).length>=2){g.shift();g=g.map(r=>{const o=['','','',''];hm.forEach((ci,j)=>{if(ci>=0)o[ci]=r[j]||''});return o});c0=0}
 else if(/^\s*date\s*$/i.test(g[0][0]||'')&&g.length>1)g.shift();
 if(!g.length)return;snap();let bad=0;const n=g.length,w=Math.max(...g.map(r=>r.length));
 if(n===1&&w===1&&(gr.r1>gr.r0||gr.c1>gr.c0)){for(let r=gr.r0;r<=gr.r1;r++)for(let c=gr.c0;c<=gr.c1;c++)if(!setVal(S.sp[r],spendCols[c],g[0][0]))bad++;SR={r1:gr.r0,c1:gr.c0,r2:gr.r1,c2:gr.c1}}
 else{while(S.sp.length<r0+n+1)S.sp.push(blank());
  g.forEach((cells,i)=>{const x=S.sp[r0+i];cells.forEach((v,j)=>{const c=c0+j;if(c>3)return;if(!setVal(x,spendCols[c],v))bad++});if(filled(x)&&!x.d)x.d=today()});
  SR={r1:r0,c1:c0,r2:r0+n-1,c2:Math.min(3,c0+w-1)}}
 pad(S);render();cell(SR.r1,SR.c1)?.scrollIntoView({block:'nearest'});
 toast(`Pasted ${n} row${n>1?'s':''}`+(bad?` · ${bad} cell${bad>1?'s':''} skipped (bad date/number)`:''))}

function vChart(){
 const f=S.fl,all=S.sp.filter(x=>x.d&&+x.a>0),
 L=all.filter(x=>(!f.y.length||f.y.includes(x.d.slice(0,4)))&&(!f.m.length||f.m.includes(x.d.slice(5,7)))).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0),
 ys=[...new Set(all.map(x=>x.d.slice(0,4)))].sort().reverse(),rs={};
 all.forEach(x=>{rs[key(x.r)]=rs[key(x.r)]||(x.r||'').trim()||'No reason'});
 const sl=(g,t,o)=>`<div class="slr"><button class="sl${f[g].length?' on':''}" data-act="sc" data-g="${g}">${t}${f[g].length?' ✕ clear':''}</button><div class="sch">${o.map(([v,n])=>`<button class="chip${f[g].includes(v)?' on':''}" data-act="sl" data-g="${g}" data-v="${esc(v)}">${esc(n)}</button>`).join('')||'<span class="sm">No data yet</span>'}</div></div>`;
 let B,note;
 if(L.length>10){const g={};L.forEach(x=>{const k=x.d.slice(0,7);g[k]=(g[k]||0)+ +x.a});const ks=Object.keys(g).sort(),multi=new Set(ks.map(k=>k.slice(0,4))).size>1;B=ks.map(k=>({l:MN[+k.slice(5)-1],s:multi?k.slice(0,4):'',v:g[k]}));note='More than 10 entries, so each bar is a month total.'}
 else{B=L.map(x=>({l:(x.r||'').trim()||'—',s:sh(x.d),v:+x.a}));note='Each bar is one entry.'}
 const mx=Math.max(1,...B.map(b=>b.v));
 const byPerson={};
 L.forEach(x=>{const name=(x.by||'Not specified').trim()||'Not specified',k=key(name);if(!byPerson[k])byPerson[k]={name,total:0,count:0};byPerson[k].total+=+x.a;byPerson[k].count++});
 const people=Object.values(byPerson).sort((a,b)=>b.total-a.total);
 const peopleMax=Math.max(1,...people.map(x=>x.total));
 const personInsight=people.length?`<h3 class="sec">Spending by person <span class="sm">· highest to lowest</span></h3><div class="reason-breakdown"><div class="reason-head"><span>Spent by</span><span>Share of spend</span><span style="text-align:right">Total</span></div>${people.map(x=>`<div class="reason-row"><div class="reason-name">${esc(x.name)}<span class="reason-meta">${x.count} ${x.count===1?'transaction':'transactions'}</span></div><div class="reason-bar-wrap"><div class="reason-bar" style="--w:${x.total/peopleMax*100}%"></div></div><div class="reason-value">${money(x.total)}<span class="reason-meta">${(x.total/sum(L)*100).toFixed(1)}%</span></div></div>`).join('')}</div>`:'';
 const byReason={};
 L.forEach(x=>{const name=(x.r||'').trim()||'No reason',k=key(name);if(!byReason[k])byReason[k]={name,total:0,count:0};byReason[k].total+=+x.a;byReason[k].count++});
 const reasons=Object.values(byReason).sort((a,b)=>b.total-a.total);
 const reasonMax=Math.max(1,...reasons.map(x=>x.total));
 const reasonTable=reasons.length?`<h3 class="sec">Spending by reason <span class="sm">· highest to lowest</span></h3><div class="reason-breakdown"><div class="reason-head"><span>Reason</span><span>Share of spend</span><span style="text-align:right">Total</span></div>${reasons.map((x,i)=>`<div class="reason-row"><div class="reason-name">${esc(x.name)}<span class="reason-meta">${x.count} ${x.count===1?'transaction':'transactions'}</span></div><div class="reason-bar-wrap" title="${(x.total/sum(L)*100).toFixed(1)}%"><div class="reason-bar" style="--w:${x.total/reasonMax*100}%"></div></div><div class="reason-value">${money(x.total)}<span class="reason-meta">${(x.total/sum(L)*100).toFixed(1)}%</span></div></div>`).join('')}</div>`:'';
 return `<p class="note"><b>${money(sum(L))}</b> in ${L.length} ${L.length==1?'entry':'entries'}. ${note}</p>`+(B.length?`<div class="plot">${B.map(b=>bar(b,mx)).join('')}</div>`:'<p class="empty">No spends match these slicers.</p>')+reasonTable+personInsight+sl('m','Month',MN.map((n,i)=>[p2(i+1),n]))+sl('y','Year',ys.map(y=>[y,y]))
}


async function copyClip(value){
 const txt=String(value||'');
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt)}else{const a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)throw 0}toast('Copied to clipboard')}
 catch(e){prompt('Copy this text:',txt)}
}
async function readClip(){
 try{if(navigator.clipboard&&window.isSecureContext)return await navigator.clipboard.readText()}catch(e){}
 return prompt('Paste transaction rows (table, Excel, CSV or one item per line):','')||'';
}
const splitCSVLine=line=>{
 const out=[];let cur='',quoted=false;
 for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++;}else quoted=!quoted;}else if(ch===','&&!quoted){out.push(cur.trim());cur='';}else cur+=ch;}
 out.push(cur.trim());return out;
};
const parseSpendPaste=raw=>{
 const lines=String(raw||'').replace(/^\uFEFF/,'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),out=[];
 const clean=v=>String(v||'').replace(/^[*_]+|[*_]+$/g,'').trim();
 const numeric=v=>{const z=String(v||'').replace(/[₹,\s]/g,'');return z!==''&&Number.isFinite(Number(z));};
 let map=null;
 for(const line of lines){
  if(/^\|?\s*:?-{2,}/.test(line))continue;
  const c=line.includes('|')?line.replace(/^\|/,'').replace(/\|$/,'').split('|').map(clean):line.includes('\t')?line.split('\t').map(clean):splitCSVLine(line).map(clean);
  if(c.length<3)continue;
  const h=c.map(v=>v.toLowerCase().replace(/[.*_]/g,'').trim());
  const di=h.findIndex(v=>v==='date'||v.includes('transaction date'));
  if(di>=0){
   const ri=h.findIndex(v=>/narration|reason|description|particulars/.test(v));
   const ai=h.findIndex(v=>/withdrawal|amount|debit/.test(v));
   const bi=h.findIndex(v=>/spent by|paid by|person/.test(v));
   if(ri>=0&&ai>=0)map={di,ri,ai,bi};
   continue;
  }
  let d=clean(c[map?map.di:0]),dm=d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(dm){let y=dm[3];if(y.length===2)y='20'+y;d=`${y}-${String(dm[2]).padStart(2,'0')}-${String(dm[1]).padStart(2,'0')}`;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;
  let a,r,by='';
  if(map){a=clean(c[map.ai]).replace(/[₹,\s]/g,'');r=clean(c[map.ri]);by=map.bi>=0?clean(c[map.bi]):'';}
  else{
   const ai=c.slice(1).findIndex(numeric)+1;if(ai<1)continue;
   a=clean(c[ai]).replace(/[₹,\s]/g,'');
   const rest=c.map((v,i)=>({v:clean(v),i})).filter(x=>x.i!==0&&x.i!==ai&&x.v);
   r=rest[0]?.v||'';by=rest.slice(1).map(x=>x.v).join(' ').trim();
  }
  if(!numeric(a)||!r)continue;
  out.push({id:uid(),d,a,r,by});
 }
 return out;
};

  case'tdel':case'sdel':{const l=d.act=='tdel'?'td':'sp',i=S[l].findIndex(x=>x.id==d.id);last={l,i,x:S[l].splice(i,1)[0]};toast('Removed. Tap to undo');break}

  case'cat':if(ce){S.cats=S.cats.filter(c=>c!=d.v);S.td.forEach(x=>{if(x.c==d.v)x.c=''});if(S.cur==d.v)S.cur='';break}S.cur=S.cur==d.v?'':d.v;document.querySelectorAll('#cr [data-act=cat]').forEach(x=>x.classList.toggle('on',x.dataset.v==S.cur));save();return;
  case'cnew':{const n=(prompt('New category name')||'').trim();if(n&&!S.cats.includes(n)){S.cats.push(n);S.cur=n}break}
  case'cedit':ce=!ce;$('#cr').innerHTML=crow();return;
  case'bud':{const v=prompt('Monthly budget in ₹ (0 clears it)',S.bud||'');if(v===null)return;S.bud=Math.max(0,+v||0);if(dlg.open)dlg.close();break}
  case'th':S.th=d.v;theme();save();menu();return;
  case'menu':menu();return;
  case'csv':{
   const q=v=>{const s=String(v==null?'':v);return '"'+s.replace(/"/g,'""')+'"'};
   const rows=[['Record Type','Date','Category','To-do','Amount (INR)','Reason','Spent By']];
   S.td.forEach(x=>rows.push(['To-do',x.d||'',x.c||'',x.t||'','','']));
   S.sp.filter(filled).forEach(x=>rows.push(['Spend',x.d||'','','',x.a||'',x.r||'',x.by||'']));
   const csv='\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n');
   const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
   const a=document.createElement('a');a.href=url;a.download='focus-data-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
   toast('CSV downloaded');return
  }
  case'exp':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='focus-backup.json';a.click();return}
  case'out':try{localStorage.removeItem(AK)}catch(x){}sess=false;dlg.close();lock();return;
  case'close':dlg.close();return;
 }
 render();
});

document.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id=='lf'){
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;
  if(cy('focus|'+u+'|'+p)==H){sess=true;if($('#lkeep').checked)try{localStorage.setItem(AK,H)}catch(x){}unlock(0,1)}
  else{const c=$('#lf');c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');$('#le').textContent='That username or password is not right. Check both and try again.';$('#lp').select()}
  return;
 }
 if(e.target.id!='addf')return;
 const f=new FormData(e.target),t=(f.get('t')||'').trim();
 if(!t)return;
 S.td.unshift({id:uid(),t,d:f.get('d')||'',c:S.cur});
 e.target.reset();render();$('#addf [name=t]').focus();
});

document.addEventListener('input',e=>{
 const t=e.target,r=t.closest('[data-l]');
 if(!r||!t.dataset.k)return;
 const l=r.dataset.l,it=S[l].find(x=>x.id==r.dataset.id);
 if(!it)return;
 it[t.dataset.k]=t.dataset.k==='d'?(spendDateISO(t.value)||t.value):t.value;
 if(l=='sp'){
  if(t.dataset.k!='d'&&!it.d){it.d=today();r.querySelector('[data-k=d]').value=today().slice(8,10)+'/'+today().slice(5,7)+'/'+today().slice(2,4)}
  r.querySelector('.dc span').textContent=spendDateISO(it.d)?sy(spendDateISO(it.d)):'';
  r.classList.toggle('f',filled(it));
  if(filled(S.sp[S.sp.length-1])){const n=blank();S.sp.push(n);$('#sheet').insertAdjacentHTML('beforeend',srow(n,S.sp.length))}
  tot();
 }
 save();
});

document.addEventListener('paste',e=>{
 if(document.body.classList.contains('lk')||dlg.open)return;
 const t=e.target,raw=e.clipboardData?.getData('text/plain')||'',multi=/[\n\t]/.test(raw.replace(/[\r\n]+$/,''));
 if(S.tab==='todo'){if(!multi)return;const a=t.closest&&t.closest('#addf')&&t.name==='t',l=t.closest&&t.closest('.ln');
  if(a){e.preventDefault();addTodos(raw,-1)}else if(l&&t.dataset.k==='t'){e.preventDefault();addTodos(raw,S.td.findIndex(x=>x.id==l.dataset.id))}return}
 if(S.tab!=='spend')return;
 if(t.id==='ed'){if(!multi)return;ed=null;t.remove();e.preventDefault();pasteGrid(raw);return}
 if(t.closest&&t.closest('input,textarea,select'))return;
 e.preventDefault();if(!SR){toast('Select a cell first');return}pasteGrid(raw)
});
const live=()=>S.tab==='spend'&&!document.body.classList.contains('lk')&&!dlg.open;
document.addEventListener('copy',e=>{if(!live()||ed||!SR||(e.target.closest&&e.target.closest('input,textarea')))return;e.clipboardData.setData('text/plain',selText());e.preventDefault();toast('Copied '+((rng().r1-rng().r0+1)*(rng().c1-rng().c0+1))+' cell(s)')});
document.addEventListener('cut',e=>{if(!live()||ed||!SR||(e.target.closest&&e.target.closest('input,textarea')))return;e.clipboardData.setData('text/plain',selText());e.preventDefault();clearSel()});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.tools button'))e.preventDefault()});
const hit=(x,y)=>{const sh=sheetEl();if(!sh)return;const R=sh.getBoundingClientRect(),T=($('.tools')?.getBoundingClientRect().bottom||90)+6,B=document.querySelector('nav').getBoundingClientRect().top-6;
 x=Math.min(Math.max(x,R.left+40),Math.min(R.right,innerWidth)-3);y=Math.min(Math.max(y,T),B);
 const el=document.elementFromPoint(x,y)?.closest('#sheet .sr .c');if(el)pick(el,true)};
function tick(){if(!drag){raf=0;return}
 const sh=sheetEl();if(!sh){drag=0;raf=0;return}const R=sh.getBoundingClientRect(),T=($('.tools')?.getBoundingClientRect().bottom||90)+6,B=document.querySelector('nav').getBoundingClientRect().top-6;
 const sp=(d)=>Math.min(30,4+d/3);
 if(py<T+36)scrollBy(0,-sp(T+36-py));else if(py>B-36)scrollBy(0,sp(py-(B-36)));
 if(px<R.left+50)sh.scrollLeft-=sp(R.left+50-px);else if(px>Math.min(R.right,innerWidth)-40)sh.scrollLeft+=sp(px-(Math.min(R.right,innerWidth)-40));
 hit(px,py);raf=requestAnimationFrame(tick)}
document.addEventListener('pointerdown',e=>{
 if(S.tab!=='spend'||e.button||!e.target.closest)return;const sh=e.target.closest('#sheet');if(!sh||e.target.closest('button')||e.target.id==='ed')return;
 if(ed)commit();
 const c=e.target.closest('.c'),rn=e.target.closest('.rn'),hd=e.target.closest('.sh [data-col]'),last=Math.max(0,S.sp.map((x,i)=>filled(x)?i:-1).reduce((a,b)=>Math.max(a,b),0));
 if(e.pointerType==='touch'&&!rm){tc=c?{el:c,x:e.clientX,y:e.clientY}:null;if(rn){SR={r1:+rn.parentElement.dataset.row,c1:0,r2:+rn.parentElement.dataset.row,c2:3};drawSpendRange()}else if(hd){const k=+hd.dataset.col;SR={r1:0,c1:k,r2:last,c2:k};drawSpendRange()}return}
 if(c){pick(c,e.shiftKey);drag=1;px=e.clientX;py=e.clientY;if(!raf)raf=requestAnimationFrame(tick)}
 else if(rn){const r=+rn.parentElement.dataset.row;SR={r1:r,c1:0,r2:r,c2:3};drawSpendRange()}
 else if(hd){const k=+hd.dataset.col;SR={r1:0,c1:k,r2:last,c2:k};drawSpendRange()}
 sh.focus({preventScroll:true});e.preventDefault()});
document.addEventListener('pointermove',e=>{if(drag){px=e.clientX;py=e.clientY}});
const endp=e=>{drag=0;if(tc&&e.type==='pointerup'&&Math.hypot(e.clientX-tc.x,e.clientY-tc.y)<10){const same=SR&&SR.r1===SR.r2&&SR.c1===SR.c2&&cell(SR.r1,SR.c1)===tc.el;if(same){edit()}else pick(tc.el)}tc=null};
document.addEventListener('pointerup',endp);document.addEventListener('pointercancel',endp);
document.addEventListener('dblclick',e=>{const c=e.target.closest&&e.target.closest('#sheet .c');if(c&&!ed&&S.tab==='spend'){pick(c);edit()}});
const AR={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
function jump(dr,dc,ex){const R=S.sp.length-1,em=(r,c)=>{const v=(S.sp[r]||{})[spendCols[c]];return v===''||v==null},ok=(r,c)=>r>=0&&r<=R&&c>=0&&c<=3;
 const r=ex?SR.r2:SR.r1,c=ex?SR.c2:SR.c1;let nr=r+dr,nc=c+dc;
 if(!ok(nr,nc)){nr=r;nc=c}
 else if(!em(r,c)&&!em(nr,nc)){while(ok(nr+dr,nc+dc)&&!em(nr+dr,nc+dc)){nr+=dr;nc+=dc}}
 else{while(ok(nr,nc)&&em(nr,nc)){nr+=dr;nc+=dc}if(!ok(nr,nc)){nr-=dr;nc-=dc}}
 if(ex){SR.r2=nr;SR.c2=nc}else SR={r1:nr,c1:nc,r2:nr,c2:nc};
 drawSpendRange();cell(nr,nc)?.scrollIntoView({block:'nearest',inline:'nearest'})}
document.addEventListener('keydown',e=>{
 if(!live())return;const t=e.target;
 if(t.id==='ed'){const k=e.key;
  if(k==='Enter'){e.preventDefault();commit();move(e.shiftKey?-1:1,0)}
  else if(k==='Tab'){e.preventDefault();commit();move(0,e.shiftKey?-1:1)}
  else if(k==='Escape'){e.preventDefault();cancelEdit();sheetEl()?.focus({preventScroll:true})}
  else if(k.startsWith('Arrow')&&(k==='ArrowUp'||k==='ArrowDown')){e.preventDefault();commit();move(k==='ArrowUp'?-1:1,0)}
  return}
 if(t.closest&&t.closest('input,textarea,select,button'))return;
 const k=e.key,m=e.ctrlKey||e.metaKey;
 if(m){if(k==='a'||k==='A'){e.preventDefault();const last=S.sp.map((x,i)=>filled(x)?i:-1).reduce((a,b)=>Math.max(a,b),0);SR={r1:0,c1:0,r2:last,c2:3};drawSpendRange()}
  else if(k==='z'||k==='Z'){e.preventDefault();undo()}else if(SR&&AR[k]){e.preventDefault();jump(AR[k][0],AR[k][1],e.shiftKey)}else if(SR&&k==='Home'){e.preventDefault();SR={r1:0,c1:0,r2:0,c2:0};drawSpendRange();cell(0,0)?.scrollIntoView({block:'nearest',inline:'nearest'})}else if(SR&&k==='End'){e.preventDefault();const l=S.sp.map((x,i)=>filled(x)?i:-1).reduce((a,b)=>Math.max(a,b),0);SR={r1:l,c1:3,r2:l,c2:3};drawSpendRange();cell(l,3)?.scrollIntoView({block:'nearest',inline:'nearest'})}return}
 if(!SR)return;
 const ar={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[k];
 if(ar){e.preventDefault();move(ar[0],ar[1],e.shiftKey)}
 else if(k==='Tab'){e.preventDefault();move(0,e.shiftKey?-1:1)}
 else if(k==='Enter'||k==='F2'){e.preventDefault();edit()}
 else if(k==='Delete'||k==='Backspace'){e.preventDefault();clearSel()}
 else if(k==='PageDown'){e.preventDefault();move(10,0,e.shiftKey)}
 else if(k==='PageUp'){e.preventDefault();move(-10,0,e.shiftKey)}
 else if(k.length===1&&!e.altKey){edit('')}
});

document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id=='imp'){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.td)||!Array.isArray(d.sp))throw 0;S=norm(d);dlg.close();theme();render();toast('Backup imported')}catch(x){toast('That file is not a Focus backup')}};
  r.readAsText(t.files[0]);return;
 }
 const r=t.closest('[data-l]');
 if(r&&r.dataset.l=='td'&&(t.dataset.k=='d'||t.dataset.k=='c'))render();
});

const lp=$('#lp'),caps=$('#capswarn');
const updateCaps=e=>{if(caps)caps.classList.toggle('show',!!(e&&e.getModifierState&&e.getModifierState('CapsLock')))};
if(lp){lp.addEventListener('keydown',updateCaps);lp.addEventListener('keyup',updateCaps);lp.addEventListener('blur',()=>caps&&caps.classList.remove('show'))}
(function(){
 const lg=$('#lg');if(!lg)return;
 const R=Math.random,layer=(col,op,bl,a,b,gap,hh)=>{let p='';
  for(let x=-30;x<1240;x+=gap*(.7+R()*.6)){const th=a+R()*(b-a),w=th*.3;
   for(let i=0;i<3;i++){const yb=400-th*(.08+.22*i),hw=w*(1-.24*i);p+=`M${x-hw},${yb}L${x},${yb-th*.4}L${x+hw},${yb}Z`}}
  return `<svg class="tl" viewBox="0 0 1200 400" preserveAspectRatio="none" style="height:${hh}%;filter:blur(${bl}px);opacity:${op}"><path fill="${col}" d="${p}M-30,400V385H1240V400Z"/></svg>`};
 let h=layer('#2f7a62',.5,2.5,130,210,36,64)+'<div class="fog" style="bottom:34%"></div>'+layer('#12493a',.85,1,180,290,50,72)+'<div class="fog" style="bottom:18%;animation-duration:55s;animation-direction:alternate-reverse"></div>'+layer('#04120d',1,0,280,420,88,82);
 for(let i=0;i<16;i++)h+=`<i class="ff" style="left:${R()*100}%;top:${40+R()*50}%;animation-delay:-${R()*9}s;animation-duration:${6+R()*7}s"></i>`;
 lg.insertAdjacentHTML('afterbegin',`<div class="fx">${h}<canvas id="rain"></canvas><div class="flash"></div></div>`);
 const cv=$('#rain'),red=matchMedia('(prefers-reduced-motion:reduce)').matches;let ctx=null,dr=[],id=0,W=0,H=0;
 try{ctx=cv.getContext('2d')}catch(e){}
 const size=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;dr=Array.from({length:Math.min(420,Math.floor(W/3.2))},()=>({x:R()*W,y:R()*H,l:12+R()*20,v:13+R()*13}))};
 const loop=()=>{if(!document.body.classList.contains('lk')||!ctx){id=0;return}
  ctx.clearRect(0,0,W,H);ctx.strokeStyle='rgba(200,235,255,.38)';ctx.lineWidth=1.1;ctx.beginPath();
  for(const d of dr){ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.l*.16,d.y+d.l);d.y+=d.v;d.x-=d.v*.16;if(d.y>H){d.y=-d.l;d.x=R()*(W+80)}}
  ctx.stroke();id=requestAnimationFrame(loop)};
 window.rainStart=()=>{};
 addEventListener('resize',()=>{if(id)size()});
})();
theme();
if(sess)unlock(1);else lock();
</script>
